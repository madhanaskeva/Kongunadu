<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Kongunadu tab icon: the logo's hexagon, white K and copper chevron, simplified for 16-32px.
       A light rim keeps it visible on dark browser tabs. -->
  <defs>
    <clipPath id="hex">
      <polygon points="32,5 55.4,18.5 55.4,45.5 32,59 8.6,45.5 8.6,18.5" />
    </clipPath>
  </defs>
  <polygon points="32,5 55.4,18.5 55.4,45.5 32,59 8.6,45.5 8.6,18.5"
           fill="#ffffff" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.9" stroke-width="9" stroke-linejoin="round" />
  <polygon points="32,5 55.4,18.5 55.4,45.5 32,59 8.6,45.5 8.6,18.5"
           fill="#275e74" stroke="#275e74" stroke-width="5" stroke-linejoin="round" />
  <g clip-path="url(#hex)">
    <polyline points="51,16 35,32 51,48" fill="none" stroke="#c98b52" stroke-width="3" />
  </g>
  <g fill="#ffffff">
    <rect x="17" y="16" width="8" height="32" />
    <polygon points="25,31 39,16 47,16 29,35" />
    <polygon points="28,31 46,48 38,48 25,37" />
  </g>
</svg>
